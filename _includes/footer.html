<footer class="site-footer h-card">
  <data class="u-url" href="{{ "/" | relative_url }}"></data>

  <div class="site-footer__inner">
    <div>
      <p class="footer-heading">{{ site.author | escape }}</p>
      <p>{{ site.description | escape }}</p>
    </div>
    <div class="footer-links" aria-label="Profile links">
      <a href="https://github.com/{{ site.github_username }}">GitHub</a>
      <a href="https://www.linkedin.com/in/{{ site.linkedin_username }}/">LinkedIn</a>
      <a href="https://orcid.org/{{ site.orcid_username }}">ORCID</a>
      <a href="{{ site.lattes_url }}">Lattes</a>
      <a href="{{ site.formless_url }}">Formless Solutions</a>
    </div>
  </div>

</footer>
