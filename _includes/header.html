<header class="site-header" role="banner">
  <div class="site-header__inner">
    <a class="brand" rel="author" href="{{ "/" | relative_url }}">
      <span class="brand__name">{{ site.title | escape }}</span>
      <span class="brand__tagline">{{ site.tagline | escape }}</span>
    </a>

    <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-navigation">
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="nav-toggle__bar"></span>
      <span class="visually-hidden">Menu</span>
    </button>

    <nav id="site-navigation" class="site-nav" aria-label="Primary navigation">
      {%- for item in site.data.navigation -%}
        <a href="{{ item.url | relative_url }}" {% if page.url == item.url %}aria-current="page"{% endif %}>{{ item.label }}</a>
      {%- endfor -%}
    </nav>
  </div>
</header>
